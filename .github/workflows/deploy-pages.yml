name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build frontend for GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify production API base
        run: |
          if [ -z "${{ vars.LUNARIS_API_BASE }}" ]; then
            echo "::error::Repository variable LUNARIS_API_BASE is required for the GitHub Pages frontend." >&2
            exit 1
          fi

      - name: Build frontend
        env:
          LUNARIS_API_BASE: ${{ vars.LUNARIS_API_BASE }}
        run: |
          python south_pole_3d.py --api-base "$LUNARIS_API_BASE" --no-show --output outputs/south_pole_3d.html

      - name: Verify generated frontend
        env:
          LUNARIS_API_BASE: ${{ vars.LUNARIS_API_BASE }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          api_base = os.environ["LUNARIS_API_BASE"]
          html = Path("outputs/south_pole_3d.html").read_text(encoding="utf-8")
          assert api_base in html, "Production API base was not embedded in the viewer"
          assert "127.0.0.1:8000" not in html, "Localhost API base remains in the viewer"
          assert "__API_BASE__" not in html, "API base placeholder remains in the viewer"
          print("Frontend API base verification passed")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: outputs

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
