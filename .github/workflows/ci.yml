name: LUNARIS CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: Data-independent unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run data-independent tests
        run: |
          python -m pytest \
            tests/test_earth_los.py \
            tests/test_spatial_representativeness.py \
            tests/test_candidate_comparison.py \
            tests/test_sun_transitions.py \
            tests/test_fetch_lfs_data.py \
            tests/validation/test_lsi_monotonicity.py \
            tests/validation/test_solar_visibility_validation.py \
            -q -p no:cacheprovider

  data-dependent-tests:
    name: Scientific tests with bundled DEM and kernels
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verify required SPICE kernels
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              "data/Ephemeris/de440s.bsp",
              "data/Ephemeris/moon_080317.tf",
              "data/Ephemeris/moon_pa_de418_1950-2050.bpc",
              "data/Ephemeris/pck00011.tpc",
          ]
          missing = [path for path in required if not Path(path).is_file()]
          if missing:
              raise SystemExit("Missing required SPICE kernels: " + ", ".join(missing))
          print("Required SPICE kernels are present")
          PY

      - name: Validate bundled runtime data
        run: python fetch_lfs_data.py

      - name: Run full test suite
        run: python -m pytest tests/ tests/validation/ -q -p no:cacheprovider

  docker-build-and-smoke-test:
    name: Docker build and runtime smoke test
    runs-on: ubuntu-latest
    needs: [unit-tests, data-dependent-tests]
    timeout-minutes: 45
    steps:
      - name: Check out repository without LFS objects
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Build Docker image
        run: docker build --progress=plain -t lunaris-release:ci .

      - name: Run container and verify health
        run: |
          set -euo pipefail
          docker run -d --name lunaris-ci -p 8000:8000 lunaris-release:ci
          healthy=0
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8000/health >/tmp/lunaris-health.json; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            echo "Lunaris health check failed"
            docker logs lunaris-ci || true
            docker rm -f lunaris-ci || true
            exit 1
          fi
          echo "Health response:"
          cat /tmp/lunaris-health.json
          docker logs lunaris-ci --tail 50
          docker rm -f lunaris-ci
